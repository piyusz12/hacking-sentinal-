# Project Sentinel - Docker Compose Configuration
# Complete DevSecOps platform with all services

version: '3.8'

services:
  # Main backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    environment:
      - SENTINEL_ENV=production
      - SENTINEL_WS_TOKEN=${SENTINEL_WS_TOKEN:-change-me-in-production}
      - OLLAMA_HOST=http://ollama:11434
      - SENTINEL_MAX_DASHBOARD=50
      - SENTINEL_MAX_ESP32=10
      - SENTINEL_MAX_AI_TASKS=5
    volumes:
      - sentinel-data:/app/data
      - ./vector_index:/app/vector_index
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - sentinel-network

  # Local AI model server
  ollama:
    image: ollama/ollama:latest
    container_name: sentinel-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - sentinel-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - sentinel-network
    profiles:
      - with-cache

  # Optional: PostgreSQL for persistence
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sentinel
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sentinel-secure-password-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend_server/models/database.py:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - sentinel-network
    profiles:
      - with-db

  # Frontend (optional - can be served by backend)
  frontend:
    build:
      context: ./sentinel-ui
      dockerfile: ../Dockerfile.frontend
    container_name: sentinel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sentinel-network
    profiles:
      - separate-frontend

volumes:
  sentinel-data:
  ollama-models:
  redis-data:
  postgres-data:

networks:
  sentinel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
