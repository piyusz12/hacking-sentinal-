# Sentinel DevSecOps Platform - Docker Compose Configuration
# Supports development and production deployments

services:
  # ===========================================
  # Backend API Service (FastAPI)
  # ===========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sentinel-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
      - "${PROMETHEUS_PORT:-9090}:9090"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=sqlite:///./data/sentinel.db
      - REDIS_URL=redis://redis:6379/0
      - WS_AUTH_TOKEN=${WS_AUTH_TOKEN:-}
      - API_KEY=${API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./vector_store:/app/vector_store
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================
  # Ollama AI Service (Local LLM)
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: sentinel-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ===========================================
  # Redis Cache Service
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================
  # Frontend Service (Nginx)
  # ===========================================
  frontend:
    build:
      context: ./sentinel-ui
      dockerfile: ../Dockerfile.frontend
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - sentinel-network
    profiles:
      - with-frontend

  # ===========================================
  # PostgreSQL Database (Optional - for production)
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: ${DB_USER:-sentinel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-network
    profiles:
      - production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sentinel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ollama_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
